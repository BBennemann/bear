[project]
name = "bear"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.3.1",
    "groq>=1.7.0",
    "langchain-core>=1.8.3",
    "langchain-google-genai>=4.5.0",
    "langchain-groq>=1.2.1",
    "langchain-openai>=1.8.2",
    "langgraph>=1.2.22",
    "numpy>=2.5.5",
    "openwakeword>=0.4.0",
    "pyaudio>=0.2.14",
    "pydantic-settings>=2.16.3",
    "requests>=2.34.2",
    "speechrecognition>=3.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
bear = "bear.main:run"
